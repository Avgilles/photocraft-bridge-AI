[project]
name = "xp-photocraft"
version = "0.1.1"
description = "Generative Fill and Remove for PhotoCraft: the selection goes to your own ComfyUI server (local or on another PC) and comes back as a masked layer"
readme = "README.md"
license = "MIT OR Apache-2.0"
license-files = ["LICENSE-MIT", "LICENSE-APACHE"]
keywords = ["comfyui", "photocraft", "generative-fill", "inpainting", "qwen-image-edit"]
authors = [
    { name = "avgilles" }
]
requires-python = ">=3.11"
dependencies = [
    "click>=8.4.2",
    "httpx>=0.28.1",
    "pillow>=12.0",
    "pydantic>=2.13",
]

[project.scripts]
xp-photocraft = "xp_photocraft.cli:main"

[build-system]
requires = ["uv_build>=0.11.7,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "black>=26.5.1",
    "mypy>=2.3.0",
    "pytest>=9.0",
    "ruff>=0.16.2",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "TID"]

[tool.ruff.lint.isort]
required-imports = ["from __future__ import annotations"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "parents"

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/xp_photocraft"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
